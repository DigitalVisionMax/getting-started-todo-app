###################################################
# Production Compose file for EC2 deployment
# 
# This file is optimized for production deployment on a single EC2 instance.
# Key changes from compose.yaml:
# - Removed develop.watch (not needed in production)
# - Removed phpmyadmin (optional, can be enabled if needed)
# - Uses pre-built images from ECR or local builds
# - Configured for persistent data storage
###################################################

services:

  proxy:
    image: traefik:v3.6
    command: --providers.docker
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      - todo-network

  backend:
    build:
      context: ./
      target: final
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DB: ${MYSQL_DB:-todos}
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      traefik.http.routers.backend.rule: Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.services.backend.loadbalancer.server.port: 3000
    restart: always
    networks:
      - todo-network

  client:
    build:
      context: ./
      target: client-build
    # Client is bundled into the backend's static files, so no separate container needed
    # This service can be removed if using the final image which includes the client
    restart: always
    networks:
      - todo-network

  mysql:
    image: mysql:9.3
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DB:-todos}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - todo-network

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_PASSWORD:-secret}
    labels:
      traefik.http.routers.phpmyadmin.rule: Host(`db.${DOMAIN:-localhost}`)
      traefik.http.services.phpmyadmin.loadbalancer.server.port: 80
    restart: always
    networks:
      - todo-network

volumes:
  todo-mysql-data:

networks:
  todo-network:
    driver: bridge
